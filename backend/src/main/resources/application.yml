spring:
  application:
    name: incident-postmortem-system

  # MongoDB configuration (we'll set this up in Step 3)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/incident-kb}
      database: incident-kb

# Google Gemini configuration
gemini:
  api-key: ${GEMINI_API_KEY:your-api-key-here}
  model: gemini-1.5-flash
  embedding-model: text-embedding-004

# Server configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Logging
logging:
  level:
    com.incidentkb: DEBUG
    org.springframework.data.mongodb: DEBUG